<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Сессия — Выход из комнаты</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--bg:#0d0f14;--panel:#151922;--panel2:#1c2230;--text:#e8eaf0;--muted:#8b93a7;--accent:#5b8def;--accent2:#3f6fd0;--line:#242b3a}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;font-size:15px;display:flex;flex-direction:column}
  nav{border-bottom:1px solid var(--line);flex:none}
  nav .wrap{max-width:820px;margin:0 auto;padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:56px}
  .logo{font-weight:700}.logo span{color:var(--accent)}
  .navlinks{display:flex;gap:16px;align-items:center;font-size:.88rem;color:var(--muted)}
  .navlinks a{cursor:pointer}.navlinks a:hover{color:var(--text)}
  main{flex:1;overflow-y:auto}
  .chat{max-width:820px;margin:0 auto;padding:24px 16px;display:flex;flex-direction:column;gap:14px}
  .msg{max-width:80%;padding:12px 16px;border-radius:14px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
  .msg.user{align-self:flex-end;background:var(--accent2);color:#fff;border-bottom-right-radius:4px}
  .msg.ai{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
  .msg.sys{align-self:center;color:var(--muted);font-size:.85rem;text-align:center;max-width:90%}
  footer{flex:none;border-top:1px solid var(--line);background:var(--panel)}
  footer .wrap{max-width:820px;margin:0 auto;padding:12px 16px;display:flex;gap:10px}
  textarea{flex:1;resize:none;padding:12px 14px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--text);font-size:15px;font-family:inherit;outline:none;max-height:140px}
  textarea:focus{border-color:var(--accent)}
  .send{width:50px;flex:none;background:var(--accent);border:none;border-radius:10px;color:#fff;font-size:18px;cursor:pointer}
  .send:hover{background:#7aa2ff}.send:disabled{opacity:.5;cursor:default}
  .welcome{color:var(--muted);font-size:.9rem;text-align:center;padding:20px}
</style>
</head>
<body>
<nav>
  <div class="wrap">
    <div class="logo"><a href="cabinet.html">Выход из <span>комнаты</span></a></div>
    <div class="navlinks">
      <a href="cabinet.html">← Мои сессии</a>
      <a id="newBtn">+ Новая</a>
    </div>
  </div>
</nav>

<main>
  <div class="chat" id="chat"></div>
</main>

<footer>
  <div class="wrap">
    <textarea id="input" rows="1" placeholder="Что тебя беспокоит?"></textarea>
    <button class="send" id="send">→</button>
  </div>
</footer>

<script>
const API_BASE = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
  ? 'http://localhost:3000' : 'https://therapy-funnel.onrender.com';
const token = localStorage.getItem('tf_token');
if (!token) location.replace('auth.html');

const params = new URLSearchParams(location.search);
const sessionId = params.get('id');
if (!sessionId) location.replace('cabinet.html');

const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');

function add(role, text){
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  d.textContent = text;
  chat.appendChild(d);
  window.scrollTo(0, document.body.scrollHeight);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

async function load(){
  try {
    const r = await fetch(`${API_BASE}/api/sessions/${sessionId}`, { headers:{ Authorization:`Bearer ${token}` } });
    if (r.status === 401) { location.replace('auth.html'); return; }
    if (r.status === 404) { location.replace('cabinet.html'); return; }
    const d = await r.json();
    const msgs = d.messages || [];
    if (!msgs.length) {
      add('sys', 'Сессия началась. Всё сказанное сохраняется в твоём кабинете.');
      add('ai', 'Привет. Как ты сейчас? Что принёс на сессию?');
    } else {
      msgs.forEach(m => add(m.role === 'user' ? 'user' : 'ai', m.content));
    }
  } catch {
    add('sys', 'Не удалось загрузить сессию. Обнови страницу.');
  }
}

async function send(){
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  input.style.height = 'auto';
  add('user', text);
  sendBtn.disabled = true;
  const pending = add('ai', '…');
  try {
    const r = await fetch(`${API_BASE}/api/sessions/${sessionId}/messages`, {
      method:'POST',
      headers:{ Authorization:`Bearer ${token}`, 'Content-Type':'application/json' },
      body: JSON.stringify({ message: text })
    });
    const d = await r.json();
    pending.remove();
    if (d.reply) add('ai', d.reply);
    else add('sys', d.error || 'Ошибка. Попробуй ещё раз.');
  } catch {
    pending.remove();
    add('sys', 'Сеть недоступна. Попробуй ещё раз.');
  }
  sendBtn.disabled = false;
  input.focus();
}

sendBtn.addEventListener('click', send);
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 140) + 'px';
});

document.getElementById('newBtn').addEventListener('click', async () => {
  const r = await fetch(`${API_BASE}/api/sessions`, { method:'POST', headers:{ Authorization:`Bearer ${token}`, 'Content-Type':'application/json' }, body:'{}' });
  const d = await r.json();
  if (d.session) location.href = 'session.html?id=' + d.session.id;
});

load();
</script>
</body>
</html>
